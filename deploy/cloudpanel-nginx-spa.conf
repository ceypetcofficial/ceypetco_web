# Add these directives inside the existing server block for ceypetco.gov.lk.
# If a `location /` block already exists, add only the try_files line to it;
# do not create a duplicate location block.
location / {
    try_files $uri $uri/ /index.html;
}

# Static files should never fall through to index.html when genuinely absent.
location ~* ^/(assets|images|documents)/ {
    try_files $uri =404;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
}

# Vite assets are content-hashed, so browsers can safely keep them for a year.
location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Uploaded image names are unique, so they are also safe to cache immutably.
location ^~ /uploads/images/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

